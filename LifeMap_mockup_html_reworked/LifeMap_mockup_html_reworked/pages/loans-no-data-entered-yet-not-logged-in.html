<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Loans - no data entered yet (not logged in)</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.12);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.65);
      --shadow: 0 18px 55px rgba(0,0,0,0.55);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
      background: rgba(11,15,20,0.72);
      border-bottom: 1px solid var(--border);
    }
    .bar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .title {
      flex: 1;
      min-width: 160px;
      font-size: 14px;
      line-height: 1.2;
    }
    .subtitle {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      white-space: nowrap;
      user-select: none;
    }
    .btn:hover { border-color: rgba(255,255,255,0.22); }
    .btn.disabled {
      opacity: 0.45;
      pointer-events: none;
    }
    main {
      max-width: 1200px;
      margin: 18px auto 34px;
      padding: 0 12px;
      display: grid;
      justify-items: center;
    }
    .frame {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    footer {
      max-width: 1200px;
      margin: 0 auto 26px;
      padding: 0 12px;
      color: var(--muted);
      font-size: 12px;
    }
    kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--text);
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="btn" href="../index.html">← All screens</a>
      <a class="btn" href="loans-no-data-entered-yet-not-logged-in-d.html" aria-label="Previous (Left Arrow)">← Prev</a>
      <a class="btn" href="loans-no-data-entered-yet-d.html" aria-label="Next (Right Arrow)">Next →</a>
      <div class="title">
        Loans - no data entered yet (not logged in)
        <span class="subtitle">Loans • Image-based mockup</span>
      </div>
      <a class="btn" href="../assets/screens/loans-no-data-entered-yet-not-logged-in.jpg" target="_blank" rel="noopener">Open image</a>
    </div>
  </header>

  <main>
    <div class="frame">
      <img src="../assets/screens/loans-no-data-entered-yet-not-logged-in.jpg" alt="Loans - no data entered yet (not logged in)">
    </div>
  </main>

  <footer>
    Keyboard: <kbd>←</kbd>/<kbd>→</kbd> to navigate, <kbd>Esc</kbd> to return to the gallery.
  </footer>

  <script>
    const prev = "loans-no-data-entered-yet-not-logged-in-d.html";
    const next = "loans-no-data-entered-yet-d.html";
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' && prev) window.location.href = prev;
      if (e.key === 'ArrowRight' && next) window.location.href = next;
      if (e.key === 'Escape') window.location.href = '../index.html';
    });
  </script>
</body>
</html>
