services:
  # Backend service
  - type: web
    name: lifemaps-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node start-render.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: lifemaps-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://lifemaps-frontend.onrender.com
      - key: CLASSIFIER_SERVICE_URL
        value: https://lifemaps-classifier.onrender.com

  # Frontend service
  - type: web
    name: lifemaps-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://lifemaps-backend.onrender.com/api

  # Expense Classifier Service (Python)
  - type: web
    name: lifemaps-classifier
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python expense_classifier_service.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lifemaps-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false  # Set this manually in Render dashboard
      - key: CLASSIFIER_PORT
        value: 5001

databases:
  - name: lifemaps-db
    plan: free
